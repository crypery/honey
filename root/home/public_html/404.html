<!DOCTYPE html>
	<html lang="en-US">
	<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>WordPress</title>
	<meta name='robots' content='max-image-preview:large, noindex, noarchive' />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel='stylesheet' id='bootstrap-css' href='/wp-includes/css/bootstrap.css' type='text/css' media='all' />
	<link rel='stylesheet' id='bootstrap-theme-css' href='/wp-includes/css/bootstrap-theme.css' type='text/css' media='all' />
	<script type='text/javascript' src='/wp-includes/js/jquery.js' id='jquery-js'></script>
	<script type='text/javascript' src='/wp-includes/js/bootstrap.js' id='bootstrap-js'></script>
	</head>
	<body class="error404">
	<div class="container" style="margin-top:70px;">
		<div class="row">
			<div class="col-md-6 col-md-offset-3 text-center">
				<div class="page-header">
					<h1>Error 404</h1>
				</div>
				<h2 class="page-title">Not Found</h2>
				<p class="page-message">Apologies, but the page you requested could not be found. Perhaps searching will help.</p>
				<form role="search" method="get" class="form-inline" action="/">
					<div class="form-group">
						<label class="sr-only" for="s">Search for:</label>
						<input type="search" id="s" class="form-control" placeholder="Search &hellip;" name="s" />
					</div>
					<button type="submit" class="btn btn-default">Search</button>
				</form>
				<p id="backtoblog"><a href="/">&larr; Back to WordPress</a></p>
			</div>
		</div>
	</div>
	</body>
	</html>
